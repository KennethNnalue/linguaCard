services:
  - type: web
    name: linguacard-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npm run start:api:production
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # paste Neon connection string in Render dashboard
      - key: CORS_ORIGIN
        sync: false          # set after Vercel deploy: https://your-app.vercel.app
      - key: JWT_SECRET
        sync: false          # generate a strong random string in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # paste Gemini API key from aistudio.google.com
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — leave blank if not using Anthropic
      - key: OPENAI_API_KEY
        sync: false          # optional — leave blank until Whisper is needed
      - key: AI_DEFAULT_PROVIDER
        value: gemini
      # ── OpenRouter (image → cards + optional story generation) ──────────────
      - key: OPENROUTER_API_KEY
        sync: false          # openrouter.ai → Keys → Create key (starts sk-or-v1-)
      - key: OPENROUTER_VISION_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: OPENROUTER_TEXT_MODEL
        value: google/gemma-4-26b-a4b-it:free
      # ── Per-task model routing (all via OPENROUTER_API_KEY) ─────────────────
      - key: ENRICHMENT_MODEL
        value: anthropic/claude-haiku-4-5
      - key: STORY_MODEL_PRO
        value: anthropic/claude-sonnet-4-6
      - key: STORY_MODEL_FREE
        value: google/gemini-2.5-flash
      # ── Groq Whisper (STT karaoke timestamps, free tier) ────────────────────
      - key: GROQ_API_KEY
        sync: false          # console.groq.com → API Keys (starts gsk_)
      # ── Google Cloud TTS (word pronunciation + story narration) ─────────────
      - key: GOOGLE_CLOUD_TTS_KEY_BASE64
        sync: false          # paste the base64 key in Render dashboard; never in yaml
      - key: GOOGLE_CLOUD_TTS_VOICE
        value: de-DE-Wavenet-B
      - key: GOOGLE_CLOUD_TTS_LANGUAGE
        value: de-DE
      - key: API_PUBLIC_URL
        value: https://linguacard-api.onrender.com  # fallback for local-disk mode
      # ── Cloudflare R2 (audio file storage) ─────────────────────────────────
      # Create a bucket at dash.cloudflare.com → R2, then generate an API token
      # with "Object Read & Write" permissions for this bucket.
      - key: R2_ACCOUNT_ID
        sync: false          # Cloudflare account ID (40-char hex)
      - key: R2_ACCESS_KEY_ID
        sync: false          # R2 API token → Access Key ID
      - key: R2_SECRET_ACCESS_KEY
        sync: false          # R2 API token → Secret Access Key
      - key: R2_BUCKET
        sync: false          # bucket name, e.g. linguacard-audio
      - key: R2_PUBLIC_URL
        sync: false          # public URL for the bucket, e.g. https://audio.linguacard.app
                             # or the r2.dev subdomain: https://pub-<hash>.r2.dev
      # ── Contact / Upgrade Email (Gmail App Password) ────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # paste Gmail address in Render dashboard
      - key: SMTP_PASS
        sync: false          # paste Gmail App Password in Render dashboard
      - key: SMTP_FROM
        value: noreply@linguacard.app
