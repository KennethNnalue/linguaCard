      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const entryId = templateData.entry;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);

            'e.preventDefault();' +

        // load/error, so awaiting would hang forever.

      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }

    }

    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });

      var gen = ++navGen;
      frame.onload = function() {

        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.

        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}

                     document.getElementById('__bundler_placeholder');

        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);

    setStatus('Error unpacking: ' + err.message);

th=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><polygon points=\"10,8 16,12 10,16\"/><\u002Fsvg>' },\n    { label: 'Stories', key: 'stories', icon: '<svg viewBox=\"0 0 24 24\" width=\"21\" height=\"21\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 4h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z\"/><path d=\"M22 4h-7a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z\"/><\u002Fsvg>' },\n    { label: 'Listen', key: 'listen', icon: '<svg viewBox=\"0 0 24 24\" width=\"21\" height=\"21\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polygon points=\"11,5 6,9 2,9 2,15 6,15 11,19\"/><path d=\"M15.5,8.5a5,5,0,0,1,0,7\"/><\u002Fsvg>' },\n  ];\n\n  // ── helpers ──\n  _artStyle(art) {\n    if (art === 'der') return { bg: '#E9EFF7', color: '#3B5C86', label: 'der' };\n    if (art === 'die') return { bg: '#F5E9EC', color: '#9B4A57', label: 'die' };\n    if (art === 'das') return { bg: '#EFEADF', color: '#74695A', label: 'das' };\n    return { bg: '#ECE7DB', color: '#8A7F6E', label: '·' };\n  }\n\n  _mapWord(w) {\n    const a = this._artStyle(w.art);\n    return {\n      ...w, open: () => this._openWord(w.id),\n      mColor: this.MASTERY_COLORS[w.m], mLabel: this.MASTERY_LABELS[w.m],\n      artBg: a.bg, artColor: a.color, artLabel: a.label,\n      notDue: !w.due,\n    };\n  }\n\n  _openWord(id) { this.setState({ prev: this.state.screen, wordId: id, screen: 'word', fab: false }); }\n\n  _go(screen, extra = {}) { this.setState({ screen, fab: false, ...extra }); }\n\n  _showToast(msg) {\n    this.setState({ toast: msg, fab: false });\n    clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.setState({ toast: '' }), 1700);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const totalWords = this.COLLECTIONS.reduce((a, c) => a + c.count, 0);\n    const totalDue = this.COLLECTIONS.reduce((a, c) => a + c.due, 0);\n    const masteredCount = this.COLLECTIONS.reduce((a, c) => a + c.mastered, 0);\n    const masteryPct = Math.round((masteredCount / totalWords) * 100);\n    const collectionCount = this.COLLECTIONS.length;\n\n    // hero mastery distribution (representative across the vault)\n    const dist = [60, 48, 55, 40, 38, 30];\n    const distTotal = dist.reduce((a, b) => a + b, 0);\n    const distSegments = dist.map((n, i) => ({ w: ((n / distTotal) * 100).toFixed(1), color: this.MASTERY_COLORS[i] }));\n\n    // collections mapped\n    const collections = this.COLLECTIONS.map(c => {\n      const ratio = c.due / c.count;\n      const high = ratio >= 0.5, med = ratio >= 0.2;\n      return {\n        ...c, open: () => this._go('collection', { colId: c.id }),\n        catLabel: c.cat.toUpperCase(),\n        pct: Math.round((c.mastered / c.count) * 100),\n        dueLabel: c.due + ' due',\n        dueBg: high ? '#F7E4DA' : med ? '#F6EEDB' : '#EAF0EC',\n        dueColor: high ? '#B5582E' : med ? '#9A7A2E' : '#3E7A5E',\n        dueBorder: high ? '#EAC9B6' : med ? '#E6D6A8' : '#CADBD0',\n      };\n    });\n\n    // index words (filter + search)\n    const q = s.search.trim().toLowerCase();\n    let indexWords = this.WORDS.filter(w => {\n      if (s.filter === 'due' && !w.due) return false;\n      if (s.filter === 'new' && w.m !== 0) return false;\n      if (s.filter === 'mastered' && w.m < 5) return false;\n      if (q && !(w.word.toLowerCase().includes(q) || w.trans.toLowerCase().includes(q))) return false;\n      return true;\n    }).map(w => this._mapWord(w));\n\n    const newCount = this.WORDS.filter(w => w.m === 0).length;\n\n    const chip = (key, label) => {\n      const on = s.filter === key;\n      const urgent = key === 'due';\n      return {\n        on: () => this.setState({ filter: key }),\n        style: `flex-shrink:0;display:flex;align-items:center;gap:6px;font-family:'Hanken Grotesk';font-size:12.5px;font-weight:${on ? 700 : 600};padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;` +\n          (on ? 'background:#211C16;color:#F4EFE4;border:1px solid #211C16;' : 'background:#FFFCF6;color:#6E6557;border:1px solid rgba(33,28,22,.12);'),\n        badge: `font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;` +\n          (on ? 'background:rgba(244,239,228,.22);color:#F4EFE4;'\n              : (urgent ? 'background:#F7E4DA;color:#B5582E;' : 'background:#EFE9DC;color:#9A8F7C;')),\n      };\n    };\n\n    // current collection\n    const colRaw = this.COLLECTIONS.find(c => c.id === s.colId) || this.COLLECTIONS[0];\n    const col = {\n      ...colRaw, catUpper: colRaw.cat.toUpperCase(),\n      pct: Math.round((colRaw.mastered / colRaw.count) * 100),\n    };\n    const colWords = this.WORDS.filter(w => w.colId === colRaw.id).map(w => this._mapWord(w));\n\n    // current word\n    const wRaw = this.WORDS.find(w => w.id === s.wordId) || this.WORDS[0];\n    const ringOffset = (138.23 * (1 - wRaw.m / 5)).toFixed(2);\n    const a = this._artStyle(wRaw.art);\n    const word = {\n      ...wRaw, artBg: a.bg, artColor: a.color, artLabel: a.label,\n      mColor: this.MASTERY_COLORS[wRaw.m], mLabel: this.MASTERY_LABELS[wRaw.m],\n      mastery: wRaw.m, ringOffset,\n      nextReview: wRaw.m >= 5 ? 'Fully mastered' : wRaw.due ? 'Due for review now' : 'Next review in 4 days',\n      syns: (wRaw.syns || []).map(sy => { const sa = this._artStyle(sy.art); return { ...sy, artBg: sa.bg, artColor: sa.color }; }),\n    };\n\n    const navItems = this.NAV.map(n => ({\n      ...n, color: n.key === 'vault' ? '#1F4034' : '#A89D8A', weight: n.key === 'vault' ? 700 : 600,\n    }));\n\n    return {\n      isHome: s.screen === 'home', isIndex: s.screen === 'index',\n      isCollection: s.screen === 'collection', isWord: s.screen === 'word',\n      showAdd: s.overlay === 'add', showImport: s.overlay === 'import',\n      fabOpen: s.fab, fabRot: s.fab ? '45deg' : '0deg',\n      toastMsg: s.toast, search: s.search,\n      totalWords, totalDue, masteredCount, masteryPct, collectionCount,\n      newCount, distSegments, collections, indexWords, indexCount: indexWords.length,\n      col, colWords, word, navItems,\n      chipAll: chip('all', 'All'), chipDue: chip('due', 'Due'),\n      chipNew: chip('new', 'New'), chipMastered: chip('mastered', 'Mastered'),\n      // handlers\n      goHome: () => this._go('home'),\n      openIndex: () => this._go('index'),\n      back: () => this._go(this.state.prev || 'home'),\n      onSearch: (e) => this.setState({ search: e.target.value }),\n      toggleFab: () => this.setState({ fab: !this.state.fab }),\n      closeFab: () => this.setState({ fab: false }),\n      openAdd: () => this.setState({ overlay: 'add', fab: false }),\n      openImport: () => this.setState({ overlay: 'import', fab: false }),\n      closeOverlay: () => this.setState({ overlay: 'none' }),\n      saveWord: () => { this.setState({ overlay: 'none' }); this._showToast('Word added to Reise & Bahn'); },\n      toast: () => this._showToast('Prototype — wired up in the build'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Vault.dc"}
