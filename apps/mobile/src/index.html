<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>LinguaCard</title>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>
  <meta name="description" content="German vocabulary learning with spaced repetition"/>
  <meta name="theme-color" content="#2D5A4E"/>

  <!-- Primary favicon (SVG, dark-mode aware) -->
  <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg"/>
  <!-- PNG fallbacks -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon/favicon-16.png"/>
  <!-- iOS home screen icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/icon-180.png"/>
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon/icon-167.png"/>
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon/icon-152.png"/>
  <link rel="apple-touch-icon" sizes="120x120" href="assets/icon/icon-120.png"/>
  <!-- iOS home screen -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="LinguaCard"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="preload" as="image" href="assets/icon/icon-512.png"/>
  <!-- Inline so the splash can paint before the application bundles load. -->
  <style>
    .lc-startup {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #111614;
      isolation: isolate;
    }
    .lc-startup::before, .lc-startup::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 180vmax;
      height: 140vmax;
      border-radius: 50%;
      background: #18231e;
      transform: rotate(-28deg);
    }
    .lc-startup::before { right: -35vmax; bottom: 28%; }
    .lc-startup::after { right: -55vmax; bottom: 62%; background: #1d2c25; }
    .lc-startup img {
      width: 128px;
      height: 128px;
      border-radius: 28px;
      box-shadow: 0 16px 56px #00000040;
    }
  </style>
</head>

<body>
  <lc-root>
    <div class="lc-startup" role="status" aria-label="Loading LinguaCard">
      <img src="assets/icon/icon-512.png" width="128" height="128" alt="LinguaCard"/>
    </div>
  </lc-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
