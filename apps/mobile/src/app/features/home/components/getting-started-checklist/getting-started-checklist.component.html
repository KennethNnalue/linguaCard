@if (visible() && nextItem(); as item) {
  <div class="checklist">
    <div class="cl-head">
      <span class="cl-title">{{ 'onboarding.checklist.title' | translate }}</span>
    </div>

    <div class="cl-row">
      <span class="cl-check" aria-hidden="true"></span>
      <span class="cl-text">{{ item.labelKey | translate }}</span>
      <button class="cl-go" (click)="navigate(item.route)">{{ 'onboarding.common.next' | translate }} →</button>
    </div>
  </div>
}
