<article class="row">
  <span class="strip" [style.background]="masteryColor()"></span>

  <button class="row-main" type="button" (click)="rowClick.emit()">
    <lc-article-badge [article]="card().content.article" />

    <span class="body">
      <span class="headword">{{ card().content.back }}</span>
      <span class="translation">{{ card().content.front }}</span>
      @if (card().content.examples[0]; as example) {
        <span class="example-target">{{ example.target }}</span>
        @if (example.native) {
          <span class="example-native">{{ example.native }}</span>
        }
      }
    </span>

    @if (isDue()) {
      <span class="due-pill">{{ 'vault.lexicon.dueTag' | translate }}</span>
    } @else {
      <span class="mastery-label">{{ masteryLabel() }}</span>
    }
  </button>

  @if (showAudio()) {
    <ion-button
      class="audio-button"
      fill="clear"
      type="button"
      (click)="playAudio.emit()"
      [attr.aria-label]="'common.aria.playPronunciation' | translate"
    >
      <ion-icon slot="icon-only" name="volume-high-outline"></ion-icon>
    </ion-button>
  }
</article>
