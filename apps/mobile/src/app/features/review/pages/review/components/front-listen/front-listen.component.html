<div class="fl-card">
  <div class="fl-hdr">
    <span class="fl-side-lbl">{{ 'review.session.listenAndRecall' | translate }}</span>
    <span class="fl-chip">{{ 'review.session.audioChip' | translate }}</span>
  </div>

  <div class="fl-body">
    <button class="fl-play" (click)="play.emit()" [attr.aria-label]="'review.session.tapToHear' | translate">
      @if (isLoading()) {
        <span class="fl-spinner"></span>
      } @else {
        <ion-icon name="play-outline"></ion-icon>
      }
    </button>
    <span class="fl-cue">{{ 'review.session.tapToHear' | translate }}</span>
    <div class="fl-pills">
      <button class="fl-pill" (click)="replay.emit()">
        <ion-icon name="refresh-outline"></ion-icon>
        {{ 'review.session.replay' | translate }}
      </button>
      <button class="fl-pill" (click)="slow.emit()">
        <ion-icon name="volume-high-outline"></ion-icon>
        {{ 'review.session.slow' | translate }}
      </button>
    </div>
  </div>

  <button class="fl-cta" (click)="reveal.emit()">
    <ion-icon name="chevron-down-outline"></ion-icon>
    {{ 'review.session.revealAnswer' | translate }}
  </button>
</div>
