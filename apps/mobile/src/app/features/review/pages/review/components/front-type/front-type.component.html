<div class="ft-card" [class.ft-card--compact]="compact()">
  <div class="ft-hdr">
    <span class="ft-side-lbl">{{ 'review.session.writeFromMemory' | translate }}</span>
    <span class="ft-chip">{{ 'review.session.typeChip' | translate }}</span>
  </div>

  <div class="ft-body">
    <span class="ft-cue">
      {{ (expectsGermanAnswer() ? 'review.session.typeGermanFor' : 'review.session.typeMeaningOf') | translate }}
    </span>
    <p class="ft-prompt">{{ prompt() }}</p>

    <input
      #answerInput
      class="ft-input"
      type="text"
      autofocus
      [value]="typed()"
      (input)="onInput($event)"
      (focus)="focusChanged.emit(true)"
      (blur)="focusChanged.emit(false)"
      (keydown.enter)="onEnter($event)"
      autocapitalize="off"
      autocorrect="off"
      autocomplete="off"
      spellcheck="false"
      [attr.placeholder]="(expectsGermanAnswer() ? 'review.session.typePlaceholder' : 'review.session.typeTranslationPlaceholder') | translate" />

    @if (expectsGermanAnswer()) {
      <div class="ft-accents">
        @for (a of accents; track a) {
          <button
            class="ft-accent"
            type="button"
            [attr.aria-label]="'review.session.insertCharacter' | translate:{ character: a }"
            (pointerdown)="preserveInputFocus($event)"
            (click)="append(a)">{{ a }}</button>
        }
      </div>
    }
  </div>

  <button
    class="ft-cta"
    [disabled]="!canSubmit()"
    (pointerdown)="preserveInputFocus($event)"
    (click)="check.emit()">
    <ion-icon name="checkmark-outline"></ion-icon>
    {{ 'review.session.checkAnswer' | translate }}
  </button>
  <button
    class="ft-dont-know"
    type="button"
    (pointerdown)="preserveInputFocus($event)"
    (click)="dontKnow.emit()">
    {{ 'review.session.dontKnow' | translate }}
  </button>
</div>
