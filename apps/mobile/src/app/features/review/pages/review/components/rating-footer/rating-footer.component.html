<div class="rf-primary-row">
  <button class="rf-sec-btn" [disabled]="busy() || !canGoPrevious()" (click)="previous.emit()">
    <ion-icon name="chevron-back-outline"></ion-icon>
    {{ 'review.session.previousBtn' | translate }}
  </button>

  @if (flipped() && (!selfRated() || readOnly())) {
    <lc-button variant="review-primary" size="md" [loading]="busy()" (click)="readOnly() ? returnToCurrent.emit() : continueReview.emit()">
      {{ 'common.continue' | translate }}
    </lc-button>
  }
</div>

@if (flipped() && selfRated() && !readOnly()) {
  <div class="rf-self-rating">
    <p>{{ 'review.session.ratingPrompt' | translate }}</p>
    <div class="rf-rating-grid">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="rf-rate rf-rate--{{ option.value }}"
          [disabled]="busy()"
          (click)="rate.emit(option.value)">
          <strong>{{ ratingKey(option.value) | translate }}</strong>
          <span>{{ option.previewLabel ?? '—' }}</span>
        </button>
      }
    </div>
  </div>
}
