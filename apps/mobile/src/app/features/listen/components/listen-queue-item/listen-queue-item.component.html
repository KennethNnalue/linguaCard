<div class="body">
  <div class="word-row">
    <span class="position">{{ position() }}</span>
    @if (item().article) {
      <lc-article-badge [article]="item().article" />
    }
    <span class="word">{{ item().article }} {{ item().target }}</span>
    <span class="translation">{{ item().native }}</span>
  </div>
</div>

<button
  type="button"
  class="audio"
  (click)="preview.emit()"
  [attr.aria-label]="'listen.queue.previewAriaLabel' | translate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
    <path d="M15.54,8.46a5,5,0,0,1,0,7.07"/>
  </svg>
</button>
