@for (m of modes(); track m.value) {
  <button
    type="button"
    class="mode"
    [class.active]="active() === m.value"
    [attr.aria-pressed]="active() === m.value"
    (click)="modeChange.emit(m.value)">

    @if (variant() === 'grid') {
      <span class="icon">
        @switch (m.value) {
          @case ('compact') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="8" y1="9" x2="20" y2="9"/>
              <line x1="8" y1="15" x2="20" y2="15"/>
              <circle cx="4" cy="9" r="1"/>
              <circle cx="4" cy="15" r="1"/>
            </svg>
          }
          @case ('examples') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/>
            </svg>
          }
          @case ('deepDive') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <line x1="12" y1="11" x2="12" y2="16"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
          }
        }
      </span>
      <span class="title">{{ m.labelKey | translate }}</span>
      <span class="sub">{{ m.descKey | translate }}</span>
    } @else {
      <span class="tab-label">{{ m.labelKey | translate }}</span>
    }
  </button>
}
