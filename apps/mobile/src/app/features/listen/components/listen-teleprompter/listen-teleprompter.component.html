@for (segment of segments(); track $index; let index = $index) {
  <div class="row" [class.played]="segment.cls === 'played'" [class.current]="segment.cls === 'playing'">
    <span class="sequence">{{ index + 1 }}</span>
    <span class="lang">{{ segment.langLabel }}</span>
    <span class="text">{{ segment.text }}</span>
    @if (segment.cls === 'playing') {
      <span class="speaking" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    }
  </div>
}
