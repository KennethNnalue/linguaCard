<ion-tabs>
  <ion-tab-bar slot="bottom" [class.hide]="hideTabBar()">
    <ion-tab-button tab="review" href="/review">
      <ion-icon aria-hidden="true" name="book-outline"></ion-icon>
      <ion-label>{{ 'tabs.review' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="vault" href="/vault">
      <ion-icon aria-hidden="true" name="file-tray-outline"></ion-icon>
      <ion-label>{{ 'tabs.vault' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="stories" href="/stories">
      <ion-icon aria-hidden="true" name="document-text-outline"></ion-icon>
      <ion-label>{{ 'tabs.stories' | translate }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="listen" href="/listen" [selected]="isListenArea()">
      <ion-icon aria-hidden="true" name="headset-outline"></ion-icon>
      <ion-label>{{ 'tabs.listen' | translate }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
