@if (isOpen()) {
  <div class="backdrop" (click)="isOpen.set(false)"></div>
}

<div class="dial-wrap">
  @if (isOpen()) {
    <div class="actions">

      <div
        class="action-item"
        [class.action-item--active]="hoveredAction() === 'addCard'"
        style="--sd-delay: 0.08s"
        (pointerenter)="setHovered('addCard')"
        (pointerleave)="setHovered(null)"
        (click)="onAction($event, 'addCard')">
        <span class="action-label">Add Card</span>
        <button class="mini-btn" aria-label="Add card">
          <ion-icon name="add-outline"></ion-icon>
        </button>
      </div>

      <div
        class="action-item"
        [class.action-item--active]="hoveredAction() === 'newCollection'"
        style="--sd-delay: 0.04s"
        (pointerenter)="setHovered('newCollection')"
        (pointerleave)="setHovered(null)"
        (click)="onAction($event, 'newCollection')">
        <span class="action-label">New Collection</span>
        <button class="mini-btn" aria-label="New collection">
          <ion-icon name="folder-open-outline"></ion-icon>
        </button>
      </div>

      <div
        class="action-item"
        [class.action-item--active]="hoveredAction() === 'import'"
        style="--sd-delay: 0s"
        (pointerenter)="setHovered('import')"
        (pointerleave)="setHovered(null)"
        (click)="onAction($event, 'import')">
        <span class="action-label">Import</span>
        <button class="mini-btn" aria-label="Import">
          <ion-icon name="cloud-upload-outline"></ion-icon>
        </button>
      </div>

    </div>
  }

  <button
    class="main-btn"
    [class.is-open]="isOpen()"
    (click)="toggle($event)"
    [attr.aria-label]="isOpen() ? 'Close menu' : 'Quick actions'"
    [attr.aria-expanded]="isOpen()">
    <ion-icon
      class="main-icon"
      [name]="isOpen() ? 'close-outline' : 'add-outline'">
    </ion-icon>
  </button>
</div>
