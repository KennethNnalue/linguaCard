@if (isOpen()) {
  <div class="backdrop" (click)="isOpen.set(false)"></div>
}

<div class="dial-wrap">
  @if (isOpen()) {
    <div class="actions">

      <div
        class="action-item"
        [class.action-item--active]="hoveredAction() === 'addCard'"
        style="--sd-delay: 0.08s"
        (pointerenter)="setHovered('addCard')"
        (pointerleave)="setHovered(null)"
        (click)="onAction($event, 'addCard')">
        <span class="action-label">{{ 'vault.addCard' | translate }}</span>
        <button class="mini-btn" [attr.aria-label]="'common.aria.addCard' | translate">
          <ion-icon name="add-outline"></ion-icon>
        </button>
      </div>

      <div
        class="action-item"
        [class.action-item--active]="hoveredAction() === 'newCollection'"
        style="--sd-delay: 0.04s"
        (pointerenter)="setHovered('newCollection')"
        (pointerleave)="setHovered(null)"
        (click)="onAction($event, 'newCollection')">
        <span class="action-label">{{ 'vault.newCollection' | translate }}</span>
        <button class="mini-btn" [attr.aria-label]="'common.aria.newCollection' | translate">
          <ion-icon name="folder-open-outline"></ion-icon>
        </button>
      </div>

      <div
        class="action-item"
        [class.action-item--active]="hoveredAction() === 'import'"
        style="--sd-delay: 0s"
        (pointerenter)="setHovered('import')"
        (pointerleave)="setHovered(null)"
        (click)="onAction($event, 'import')">
        <span class="action-label">{{ 'vault.import' | translate }}</span>
        <button class="mini-btn" [attr.aria-label]="'common.aria.import' | translate">
          <ion-icon name="cloud-upload-outline"></ion-icon>
        </button>
      </div>

    </div>
  }

  <button
    class="main-btn"
    [class.is-open]="isOpen()"
    (click)="toggle($event)"
    [attr.aria-label]="isOpen() ? ('common.aria.closeMenu' | translate) : ('common.aria.quickActions' | translate)"
    [attr.aria-expanded]="isOpen()">
    <ion-icon
      class="main-icon"
      [name]="isOpen() ? 'close-outline' : 'add-outline'">
    </ion-icon>
  </button>
</div>
