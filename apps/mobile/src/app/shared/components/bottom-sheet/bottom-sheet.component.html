<div class="sheet-handle"></div>

@if (title()) {
  <div class="sheet-header">
    <span class="sheet-title">{{ title() }}</span>
    <button class="sheet-close" (click)="dismiss()" aria-label="Close">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>
}

<div class="sheet-actions">
  @for (action of actions(); track action.label) {
    @if (action.role !== 'cancel') {
      <button
        class="sheet-action"
        [class.sheet-action--destructive]="action.role === 'destructive'"
        (click)="select(action)">
        @if (action.icon) {
          <ion-icon [name]="action.icon" class="action-icon"></ion-icon>
        }
        <span class="action-copy">
          <strong class="action-label">{{ action.label }}</strong>
          @if (action.description) { <small>{{ action.description }}</small> }
        </span>
        <ion-icon name="chevron-forward-outline" class="action-chevron"></ion-icon>
      </button>
    } @else {
      <button class="sheet-cancel" (click)="select(action)">{{ action.label }}</button>
    }
  }
</div>
