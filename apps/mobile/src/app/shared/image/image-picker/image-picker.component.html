<div class="lc-img-picker">
  <button class="lc-img-picker__camera" (click)="pickFromCamera()">
    <ion-icon name="camera-outline"></ion-icon>
    <span class="lc-img-picker__label">Take a photo</span>
    <span class="lc-img-picker__sub">Point at any German text</span>
  </button>

  <button class="lc-img-picker__gallery" (click)="pickFromGallery()">
    <ion-icon name="images-outline"></ion-icon>
    <span class="lc-img-picker__label">Choose from gallery</span>
    <span class="lc-img-picker__sub">Pick an existing photo</span>
  </button>

  <!-- Web fallback -->
  <input
    #fileInput
    type="file"
    accept="image/jpeg,image/png,image/webp"
    style="display:none"
    (change)="onWebFileSelected($event)" />
</div>
