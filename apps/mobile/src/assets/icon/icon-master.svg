<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>LinguaCard App Icon</title>
  <desc>Open book with serif A and German article badge on brand green background</desc>

  <defs>
    <radialGradient id="ig" cx="50%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- iOS squircle clip (optional) -->
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" fill="#2D5A4E"/>
  <!-- Subtle highlight -->
  <rect width="1024" height="1024" rx="230" fill="url(#ig)"/>

  <!-- ── Book body ── -->

  <!-- Left page (slightly tilted inward, simulated with opacity) -->
  <rect x="192" y="296" width="280" height="432" rx="24" fill="#E8F2EE" opacity="0.95"/>
  <!-- Left page inner spine shadow -->
  <rect x="192" y="296" width="44" height="432" rx="24" fill="#2D5A4E" opacity="0.10"/>

  <!-- Right page (foreground, slightly wider) -->
  <rect x="490" y="280" width="342" height="464" rx="24" fill="#FFFFFF"/>
  <!-- Right page inner spine glow -->
  <rect x="490" y="280" width="36" height="464" fill="#4A8C7A" opacity="0.09"/>

  <!-- Spine -->
  <rect x="468" y="268" width="28" height="488" rx="14" fill="#1A3830"/>

  <!-- ── Left page ruled lines ── -->
  <rect x="254" y="396" width="176" height="16" rx="8" fill="#4A8C7A" opacity="0.28"/>
  <rect x="254" y="438" width="140" height="16" rx="8" fill="#4A8C7A" opacity="0.20"/>
  <rect x="254" y="480" width="162" height="16" rx="8" fill="#4A8C7A" opacity="0.16"/>
  <rect x="254" y="522" width="120" height="16" rx="8" fill="#4A8C7A" opacity="0.12"/>
  <rect x="254" y="564" width="148" height="16" rx="8" fill="#4A8C7A" opacity="0.10"/>

  <!-- ── Serif "A" on right page ── -->
  <text
    x="660"
    y="574"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="240"
    font-weight="700"
    fill="#2D5A4E"
    opacity="0.90"
  >A</text>

  <!-- ── "der" article badge on right page ── -->
  <rect x="556" y="620" width="210" height="72" rx="36" fill="#EAF2FC"/>
  <text
    x="661"
    y="672"
    text-anchor="middle"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    fill="#1A56A3"
    letter-spacing="3"
  >der</text>

  <!-- ── Accent dot (orange) — top right ── -->
  <circle cx="804" cy="248" r="52" fill="#E07B3F"/>
  <!-- Inner highlight ring -->
  <circle cx="804" cy="248" r="30" fill="#FDF0E6" opacity="0.85"/>

  <!-- ── Page curl — bottom right of right page ── -->
  <path d="M808 744 Q832 744 832 720 Q832 760 792 760 Z" fill="#F0F7F4" opacity="0.7"/>
</svg>
