<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>LinguaCard Favicon</title>
  <desc>Simplified open book mark on brand green</desc>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#2D5A4E"/>

  <!-- Left page -->
  <rect x="5" y="9" width="9" height="14" rx="1.5" fill="#4A8C7A"/>

  <!-- Right page -->
  <rect x="14.5" y="8.5" width="12.5" height="15" rx="1.5" fill="#E8F2EE"/>

  <!-- Spine -->
  <rect x="13.5" y="8" width="2" height="16" rx="1" fill="#1A3830"/>

  <!-- Letter A -->
  <text
    x="20.5"
    y="19"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, serif"
    font-size="9"
    font-weight="700"
    fill="#2D5A4E"
  >A</text>

  <!-- Orange accent dot -->
  <circle cx="26" cy="8" r="2.5" fill="#E07B3F"/>
</svg>
